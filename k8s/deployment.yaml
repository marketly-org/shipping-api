apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-api
  namespace: marketly
  labels:
    app: shipping-api
    tier: api
  annotations:
    sentinel.io/repo: "marketly-org/shipping-api"
    sentinel.io/branch: "main"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shipping-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shipping-api
        tier: api
    spec:
      containers:
        - name: app
          image: ghcr.io/marketly-org/shipping-api:sha-19e39ba
          ports:
            - containerPort: 8080
          env:
            - name: SHIPPING_CARRIER_URL
              value: "https://api.example-carrier.com/v1/quote"
            - name: SHIPPING_CARRIER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: marketly-carrier-credentials
                  key: api-key
            - name: SERVER_PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # JVM boot is CPU-heavy; liveness must not fire before the app
          # has actually bound its port (up to 3 min grace at 1 CPU).
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
